name: Build ESP32-S3 MicroPython + LVGL 9.6

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lvgl-s3/**'
  pull_request:
    branches: [master]
    paths:
      - 'lvgl-s3/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build firmware (ESP32-S3 SPIRAM_OCT)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone lv_micropython
        run: |
          git clone --recurse-submodules https://github.com/lvgl/lv_micropython.git lv_micropython
          cd lv_micropython
          git checkout 44aa2b1 2>/dev/null || true

      - name: Initialize and update LVGL submodule
        run: |
          cd lv_micropython
          git submodule update --init --recursive user_modules/lv_binding_micropython

      - name: Checkout LVGL 9.6.x commit in submodule
        run: |
          cd lv_micropython/user_modules/lv_binding_micropython
          git checkout 032dda4

      - name: Configure LV_CFLAGS
        run: |
          echo "LV_CFLAGS=-DLV_COLOR_DEPTH=16 -DLV_FONT_MONTSERRAT_12=1 -DLV_FONT_MONTSERRAT_14=1 -DLV_FONT_MONTSERRAT_16=1 -DLV_FONT_MONTSERRAT_20=1 -DLV_FONT_MONTSERRAT_24=1 -DLV_FONT_MONTSERRAT_28=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF v5.2.2
        run: |
          cd $HOME
          git clone -b v5.2.2 --recursive https://github.com/espressif/esp-idf.git esp-idf-v5.2.2
          cd esp-idf-v5.2.2
          ./install.sh esp32s3
          echo "$HOME/esp-idf-v5.2.2" >> $GITHUB_PATH
          echo "IDF_PATH=$HOME/esp-idf-v5.2.2" >> $GITHUB_ENV

      - name: Build MicroPython firmware
        env:
          LV_CFLAGS: -DLV_COLOR_DEPTH=16 -DLV_FONT_MONTSERRAT_12=1 -DLV_FONT_MONTSERRAT_14=1 -DLV_FONT_MONTSERRAT_16=1 -DLV_FONT_MONTSERRAT_20=1 -DLV_FONT_MONTSERRAT_24=1 -DLV_FONT_MONTSERRAT_28=1
        run: |
          cd lv_micropython/ports/esp32
          . $HOME/esp-idf-v5.2.2/export.sh
          make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: micropython-esp32s3-lvgl96
          path: lv_micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/micropython.bin
          retention-days: 30